<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>GUIA BEM PUNTO D</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <main>
        <div class="casa">
            <h1>Primer seccion</h1>
            <div class="cocina">
                <p class="cocina__olla">olla</p>
                <p class="cocina__plato">plato</p>
                <p class="cocina__vaso">vaso</p>
            </div>
            <h1>Segunda seccion</h1>
            <div class="habitacion">
                <p class="habitacion__cama">cama</p>
                <p class="habitacion__armario--big habitacion__armario--rojo">armario</p>
                <p class="habitacion__lampara">lampara</p>
            </div>
            <h1>Tercera seccion</h1>
            <div class="sala">
                <p class="sala__sofa sala__sofa--verde sala__sofa--grande">sofa</p>
                <p class="sala__television">television</p>
                <p class="sala__mesa">mesa</p>
            </div>
            
        </div>
    </main>
</body>
</html>
